name: LithoManager CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Show repository structure
        run: |
            pwd
            ls -la
            find . -maxdepth 3 -type f \( -name "*.sln" -o -name "*.slnx" \) -print

      - name: Restore .NET dependencies
        run: dotnet restore LithoManagerPro.sln