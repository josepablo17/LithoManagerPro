name: LithoManager CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore backend dependencies
        run: dotnet restore LithoManagerPro/LithoManager.Api/LithoManager.Api.csproj

      - name: Build backend
        run: dotnet build LithoManagerPro/LithoManager.Api/LithoManager.Api.csproj --no-restore

      - name: Restore unit test dependencies
        run: dotnet restore LithoManagerPro/UnitTests/LithoManager.UnitTests.csproj

      - name: Run unit tests
        run: dotnet test LithoManagerPro/UnitTests/LithoManager.UnitTests.csproj --no-restore

  frontend:
       name: Frontend Build
       runs-on: ubuntu-latest

       steps:
         - name: Checkout repository
           uses: actions/checkout@v4

         - name: Setup Node
           uses: actions/setup-node@v7
           with:
            node-version: '22'

         - name: Install frontend dependencies
           run: npm ci
           working-directory: LithoManagerPro/LithoManager.Client

         - name: Build frontend
           run: npm run build
           working-directory: LithoManagerPro/LithoManager.Client